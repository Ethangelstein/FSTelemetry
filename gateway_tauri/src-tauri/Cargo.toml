[package]
name = "gateway-tauri"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.8.5", features = [] }
tokio = { version = "1", features = ["full"] }
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
log = "0.4"
env_logger = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }
